services:
  postgres:
    image: postgres:16-alpine
    container_name: suniti_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: suniti_admin
      POSTGRES_PASSWORD: suniti_secure_password
      POSTGRES_DB: suniti_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  pgdata:
